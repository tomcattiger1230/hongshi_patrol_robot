pointcloud_to_laserscan:
  ros__parameters:
    # The scan is expressed in lidar_link at z=1.5 m. Keep returns whose base
    # height is roughly 0.15..2.0 m, excluding ground and high ceiling points.
    target_frame: ""
    transform_tolerance: 0.10
    min_height: -1.35
    max_height: 0.50
    angle_min: -3.141592654
    angle_max: 3.141592654
    angle_increment: 0.008726646
    scan_time: 0.10
    range_min: 0.30
    range_max: 20.0
    use_inf: true
    queue_size: 4
