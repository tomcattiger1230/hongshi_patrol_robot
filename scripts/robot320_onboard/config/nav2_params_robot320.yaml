# ============================================================
# Robot320 Nav2 配置 - Jazzy 兼容版
# 基于官方 /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odometry/filtered"
    bt_loop_duration: 10
    # Jazzy registers built-in BT nodes automatically. The former explicit
    # plugin list registered NavigateToPose twice and crashed bt_navigator.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.35
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: false
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.77, 0.435], [0.77, -0.435], [-0.77, -0.435], [-0.77, 0.435]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "point_cloud"
        point_cloud:
          topic: "/filtered_points"
          max_obstacle_height: 2.5
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.3
          obstacle_max_range: 12.0
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: false
      footprint: "[[0.77, 0.435], [0.77, -0.435], [-0.77, -0.435], [-0.77, 0.435]]"
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.2
      allow_unknown: true
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 2.35
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.01
      analytic_expansion_ratio: 2.0
      analytic_expansion_max_length: 10.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_link"
    transform_tolerance: 1.0
    spin:
      spin_angular_velocity: 0.3
    back_up:
      backup_linear_velocity: -0.1
      backup_duration: 1.0
    wait:
      wait_duration: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.3, 0.0, -0.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.01]
    velocity_timeout: 0.5

# ============================================================
# collision_monitor - Jazzy 官方格式
# ✅ points: 字符串格式 "[[x,y], ...]"
# ✅ type: "pointcloud" (对于 PointCloud2 数据)
# ============================================================
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel_safe"
    transform_tolerance: 0.1
    source_timeout: 2.0
    stop_pub_timeout: 1.0
    # The MID-360 timestamp can lead the 30 Hz EKF transform by a few
    # milliseconds. Avoid odom-based motion compensation so collision checks
    # only require the static livox_frame -> base_link transform.
    base_shift_correction: false

    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      points: "[[1.05, 0.55], [1.05, -0.55], [-1.05, -0.55], [-1.05, 0.55]]"
      action_type: "approach"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: true
      polygon_pub_topic: "stop_zone"
      enabled: true

    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/filtered_points"
      min_height: 0.0
      max_height: 2.0
      radius: 0.3
      obstacle_max_range: 5.0
      obstacle_min_range: 0.3
      raytrace_max_range: 5.0
      raytrace_min_range: 0.3
      enabled: true

# Jazzy navigation_launch.py always manages docking_server. Register the
# built-in dock plugin so lifecycle bringup can complete. No docking action is
# executed unless an explicit docking goal is sent.
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
